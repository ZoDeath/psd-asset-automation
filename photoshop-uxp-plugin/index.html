<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <script src="templates.js"></script>
  <script src="index.js" defer></script>
</head>
<body>
  <main>
    <h1>RHV Art Asset Automation</h1>
    <p id="status">Connecting to MCP server...</p>
    <button id="rename" type="button">Apply RHV naming</button>
    <button id="refresh" type="button">Refresh current document</button>
    <!--
      Test controls are intentionally disabled while Photoshop work is driven
      by MCP. They will be restored after the workflow is confirmed.
      <button id="rename" type="button">Apply RHV naming</button>
      <button id="place" type="button">Choose photo and place</button>
      <button id="batch-place" type="button">Auto-place RM (test)</button>
      <button id="inspect-rm" type="button">Inspect RM smart object</button>
    -->
    <pre id="summary">Waiting for an open PSD.</pre>
  </main>
</body>
</html>
